name: ViralForge Security Test

on:
  push:
    paths:
      - ".github/workflows/free-source-test.yml"
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify automation endpoint rejects unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -X POST             "https://viralforge-ai-jwuo.onrender.com/api/free-source/process"             -H "Content-Type: application/json"             --data '{"source_url":"https://example.com/test.mp4","title":"security-test","target_length":15}')
          cat /tmp/body.txt
          echo "HTTP_STATUS=$CODE"
          test "$CODE" = "401"
          echo "SUCCESS: automation endpoint is locked."
